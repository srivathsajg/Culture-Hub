<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select State - WanderIndia</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
      margin: 0;
      padding: 0;
    }
    
    .state-selection-container {
      max-width: 1000px;
      margin: 120px auto 40px;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .state-selection-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .state-selection-header h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 10px;
    }
    
    .state-selection-header p {
      color: #666;
      font-size: 1.2rem;
    }
    
    .state-selection-form {
      text-align: center;
      margin-bottom: 30px;
    }
    
    #stateSelect {
      padding: 12px 20px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: 1px solid #ddd;
      width: 300px;
      max-width: 100%;
      background-color: white;
      cursor: pointer;
    }
    
    .explore-button {
      display: inline-block;
      background-color: #ff6b6b;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 15px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .explore-button:hover {
      background-color: #ff4757;
    }
    
    .welcome-message {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background-color: rgba(255, 107, 107, 0.1);
      border-radius: 8px;
    }
    
    .welcome-message p {
      font-size: 1.1rem;
      color: #333;
      margin: 0;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-logo">INDIA:LAND OF TOURISM</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><a href="#" id="logoutLink">Logout</a></li>
    </ul>
  </nav>

  <div class="state-selection-container">
    <div class="welcome-message">
      <p id="welcomeUser">Welcome! Please select a state to explore.</p>
    </div>
    
    <div class="state-selection-header">
      <h1>Explore Indian States</h1>
      <p>Select a state from the dropdown to discover its tourism attractions</p>
    </div>
    
    <div class="state-selection-form">
      <select id="stateSelect">
        <option value="">-- Select a State --</option>
        <!-- State options will be dynamically loaded -->
      </select>
      <br>
      <button class="explore-button" id="exploreButton">Explore</button>
    </div>
  </div>

  <script src="states.js"></script>
</body>
</html>
